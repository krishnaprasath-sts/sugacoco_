<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sugacoco order management: PI, payments, QC, packaging, shipping documents and closure in one place. Staff sign-in." />
    <meta name="theme-color" content="#4B1863" />
    <link rel="icon" type="image/png" href="/src/assets/favicon.png" />
    <title>Sugacoco</title>
    <!-- Static sign-in copy ("app shell", added to the built file by scripts/prerender-shell.mjs, see src/lib/appShell.ts).
         It is shown only to visitors who are not signed in, use the light theme and are not on a tracking link. -->
    <style>
      #app-shell { display: none; }
      html.shell-on #app-shell { display: block; }
      html.shell-on #app-shell ~ #root { display: none; }
    </style>
    <script>
      (function () {
        try {
          if (location.pathname.indexOf('/track/') === 0) return;
          if (localStorage.getItem('sugacoco.session') === '1') return;
          if (localStorage.getItem('sugacoco.theme') === 'dark') return;
          document.documentElement.className += ' shell-on';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
